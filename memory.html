<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .grid-container { perspective: 1000px; }
        .card { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { backface-visibility: hidden; }
        .card-front { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center py-12 relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-purple-600/10 rounded-full blur-[150px] -z-10"></div>
    
    <a href="index.html" class="absolute top-6 left-6 px-5 py-2.5 glass-panel rounded-xl hover:bg-slate-800 transition-colors flex items-center gap-2 group z-10">
        <span class="group-hover:-translate-x-1 transition-transform">←</span> Back to Hub
    </a>

    <div class="glass-panel p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center mt-12 md:mt-0 max-w-4xl w-full mx-4">
        <h1 class="text-4xl md:text-5xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">Memory Match</h1>
        <div class="flex gap-8 mb-8">
            <p class="text-slate-300">Moves: <span id="moves" class="font-bold text-white text-xl">0</span></p>
            <p class="text-slate-300">Matches: <span id="matches" class="font-bold text-white text-xl">0</span>/8</p>
        </div>
        
        <div class="grid-container grid grid-cols-4 gap-3 md:gap-4 w-full max-w-lg" id="grid"></div>
        
        <button onclick="init()" class="mt-10 px-8 py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white font-bold rounded-xl transition-all shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:-translate-y-1 active:translate-y-0">Restart Game</button>
    </div>

    <script>
        const emojis = ['🚀', '🛸', '⭐', '🪐', '☄️', '🌌', '🌍', '👽'];
        let cards = [];
        let flipped = [];
        let matchedCount = 0;
        let movesCount = 0;
        let isProcessing = false;
        
        function init() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            matchedCount = 0;
            movesCount = 0;
            flipped = [];
            isProcessing = false;
            
            document.getElementById('moves').innerText = movesCount;
            document.getElementById('matches').innerText = matchedCount;
            
            let deck = [...emojis, ...emojis].sort(() => 0.5 - Math.random());
            
            deck.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'card w-full aspect-[3/4] relative rounded-xl shadow-md';
                card.dataset.val = emoji;
                card.innerHTML = `
                    <div class="card-face card-back absolute inset-0 bg-gradient-to-br from-slate-700 to-slate-800 rounded-xl flex items-center justify-center text-3xl md:text-4xl shadow-inner border border-slate-600/50 hover:bg-slate-700 transition-colors">✨</div>
                    <div class="card-face card-front absolute inset-0 bg-gradient-to-br from-purple-900 to-indigo-900 rounded-xl flex items-center justify-center text-4xl md:text-5xl shadow-inner border border-purple-500/30">${emoji}</div>
                `;
                
                // Entrance animation
                card.style.animation = `popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) ${i * 0.05}s both`;
                
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
                cards.push(card);
            });
        }
        
        function flipCard(card) {
            if(isProcessing || flipped.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            flipped.push(card);
            
            if(flipped.length === 2) {
                movesCount++;
                document.getElementById('moves').innerText = movesCount;
                checkMatch();
            }
        }
        
        function checkMatch() {
            isProcessing = true;
            const [card1, card2] = flipped;
            
            if(card1.dataset.val === card2.dataset.val) {
                matchedCount++;
                document.getElementById('matches').innerText = matchedCount;
                
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    
                    // Match animation
                    card1.querySelector('.card-front').style.borderColor = '#4ade80';
                    card2.querySelector('.card-front').style.borderColor = '#4ade80';
                    card1.querySelector('.card-front').style.boxShadow = '0 0 20px rgba(74, 222, 128, 0.4)';
                    card2.querySelector('.card-front').style.boxShadow = '0 0 20px rgba(74, 222, 128, 0.4)';
                    
                    flipped = [];
                    isProcessing = false;
                    
                    if(matchedCount === 8) {
                        setTimeout(() => alert(`You win! Completed in ${movesCount} moves. 🎉`), 500);
                    }
                }, 500);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flipped = [];
                    isProcessing = false;
                }, 1000);
            }
        }
        
        // Add dynamic CSS for animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes popIn {
                0% { transform: scale(0.5); opacity: 0; }
                100% { transform: scale(1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
        
        init();
    </script>
</body>
</html>
