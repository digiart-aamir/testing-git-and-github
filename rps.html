<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .choice-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.1);
        }
        .choice-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(236, 72, 153, 0.3), inset 0 2px 5px rgba(255, 255, 255, 0.2);
        }
        .choice-btn:active { transform: translateY(2px) scale(0.95); }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-pink-600/30 rounded-full blur-[100px] -z-10"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-rose-600/20 rounded-full blur-[100px] -z-10"></div>

    <a href="index.html" class="absolute top-6 left-6 px-5 py-2.5 glass-panel rounded-xl hover:bg-slate-800 transition-colors flex items-center gap-2 group z-10">
        <span class="group-hover:-translate-x-1 transition-transform">←</span> Back to Hub
    </a>

    <div class="glass-panel p-10 rounded-[2.5rem] flex flex-col items-center max-w-2xl w-full mx-4 shadow-2xl relative z-10">
        <h1 class="text-4xl md:text-5xl font-black mb-8 bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-rose-400 tracking-tight">Ro-Sham-Bo</h1>
        
        <!-- Score Board -->
        <div class="flex items-center justify-center gap-12 w-full mb-12 bg-slate-900/50 py-6 rounded-2xl border border-slate-700/50">
            <div class="text-center">
                <div class="text-slate-400 text-sm font-bold uppercase tracking-widest mb-1">You</div>
                <div class="text-5xl font-black text-white" id="u-score">0</div>
            </div>
            <div class="text-slate-500 text-2xl font-black">-</div>
            <div class="text-center">
                <div class="text-slate-400 text-sm font-bold uppercase tracking-widest mb-1">CPU</div>
                <div class="text-5xl font-black text-white" id="c-score">0</div>
            </div>
        </div>
        
        <!-- Arena -->
        <div class="flex items-center justify-center gap-8 mb-10 h-32 w-full">
            <div id="player-move" class="text-7xl w-24 text-center opacity-0 transform -translate-x-10 transition-all duration-300">❓</div>
            <div class="text-2xl font-black text-slate-600 italic">VS</div>
            <div id="cpu-move" class="text-7xl w-24 text-center opacity-0 transform translate-x-10 transition-all duration-300">❓</div>
        </div>

        <div id="result" class="text-2xl font-bold mb-10 h-8 text-center text-slate-300">Choose your weapon!</div>
        
        <!-- Controls -->
        <div class="flex gap-4 md:gap-8">
            <button onclick="play('rock')" class="choice-btn w-20 h-20 md:w-28 md:h-28 text-4xl md:text-5xl bg-gradient-to-br from-slate-700 to-slate-800 rounded-full flex items-center justify-center border-4 border-slate-600">✊</button>
            <button onclick="play('paper')" class="choice-btn w-20 h-20 md:w-28 md:h-28 text-4xl md:text-5xl bg-gradient-to-br from-slate-700 to-slate-800 rounded-full flex items-center justify-center border-4 border-slate-600">✋</button>
            <button onclick="play('scissors')" class="choice-btn w-20 h-20 md:w-28 md:h-28 text-4xl md:text-5xl bg-gradient-to-br from-slate-700 to-slate-800 rounded-full flex items-center justify-center border-4 border-slate-600">✌️</button>
        </div>
    </div>

    <script>
        let uScore = 0;
        let cScore = 0;
        const choices = ['rock', 'paper', 'scissors'];
        const emoji = {rock: '✊', paper: '✋', scissors: '✌️'};
        
        const pMoveEl = document.getElementById('player-move');
        const cMoveEl = document.getElementById('cpu-move');
        const resultEl = document.getElementById('result');
        
        function play(userChoice) {
            // Reset animations
            pMoveEl.style.opacity = '0';
            cMoveEl.style.opacity = '0';
            pMoveEl.classList.remove('animate-pop');
            cMoveEl.classList.remove('animate-pop');
            
            const cpuChoice = choices[Math.floor(Math.random() * 3)];
            
            setTimeout(() => {
                // Show moves
                pMoveEl.innerText = emoji[userChoice];
                cMoveEl.innerText = emoji[cpuChoice];
                pMoveEl.style.opacity = '1';
                pMoveEl.style.transform = 'translateX(0)';
                cMoveEl.style.opacity = '1';
                cMoveEl.style.transform = 'translateX(0)';
                pMoveEl.classList.add('animate-pop');
                cMoveEl.classList.add('animate-pop');
                
                // Determine Winner
                let res = '';
                let resultClass = '';
                
                if(userChoice === cpuChoice) {
                    res = `It's a tie!`;
                    resultClass = 'text-slate-300';
                } else if(
                    (userChoice === 'rock' && cpuChoice === 'scissors') ||
                    (userChoice === 'paper' && cpuChoice === 'rock') ||
                    (userChoice === 'scissors' && cpuChoice === 'paper')
                ) {
                    res = `You win! ${userChoice} beats ${cpuChoice}.`;
                    resultClass = 'text-green-400';
                    uScore++;
                } else {
                    res = `You lose! ${cpuChoice} beats ${userChoice}.`;
                    resultClass = 'text-pink-500';
                    cScore++;
                }
                
                // Update UI
                resultEl.innerText = res;
                resultEl.className = `text-2xl font-bold mb-10 h-8 text-center animate-pop ${resultClass}`;
                
                document.getElementById('u-score').innerText = uScore;
                document.getElementById('c-score').innerText = cScore;
            }, 100);
        }
    </script>
</body>
</html>
