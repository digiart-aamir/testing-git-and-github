<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .cell {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cell:hover { background: rgba(79, 70, 229, 0.3); transform: scale(1.05); }
        .cell.x { color: #818cf8; text-shadow: 0 0 15px rgba(129, 140, 248, 0.5); }
        .cell.o { color: #f472b6; text-shadow: 0 0 15px rgba(244, 114, 182, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[120px] -z-10"></div>
    
    <a href="index.html" class="absolute top-6 left-6 px-5 py-2.5 glass-panel rounded-xl hover:bg-slate-800 transition-colors flex items-center gap-2 group">
        <span class="group-hover:-translate-x-1 transition-transform">←</span> Back to Hub
    </a>

    <div class="glass-panel p-10 rounded-3xl shadow-2xl flex flex-col items-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 drop-shadow-sm">Tic Tac Toe</h1>
        <div id="status" class="mb-8 text-xl text-slate-300 tracking-wide">Player X's turn</div>
        
        <div class="grid grid-cols-3 gap-3" id="board">
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="0"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="1"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="2"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="3"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="4"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="5"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="6"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="7"></div>
            <div class="cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner" data-idx="8"></div>
        </div>
        
        <button onclick="reset()" class="mt-10 px-8 py-3 bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-400 hover:to-cyan-400 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:-translate-y-1 active:translate-y-0">Restart Game</button>
    </div>
    
    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let player = "X";
        let active = true;
        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');
        
        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                let idx = cell.getAttribute('data-idx');
                if(board[idx] !== "" || !active) return;
                
                board[idx] = player;
                cell.innerText = player;
                cell.classList.add(player.toLowerCase());
                
                // Add pop animation
                cell.animate([{transform: 'scale(0.8)'}, {transform: 'scale(1.1)'}, {transform: 'scale(1)'}], {duration: 300});
                
                checkWin();
            });
        });
        
        const winConditions = [ [0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6] ];
        
        function checkWin() {
            let roundWon = false;
            let winningCells = [];
            for(let i=0; i<8; i++) {
                const [a, b, c] = winConditions[i];
                if(board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCells = [a, b, c];
                    break;
                }
            }
            if(roundWon) {
                statusDisplay.innerHTML = `<span class="${player === 'X' ? 'text-indigo-400' : 'text-pink-400'} font-bold">Player ${player} wins! 🎉</span>`;
                winningCells.forEach(i => {
                    cells[i].style.background = 'rgba(79, 70, 229, 0.4)';
                });
                active = false; return;
            }
            if(!board.includes("")) {
                statusDisplay.innerText = `It's a Draw! 🤝`;
                active = false; return;
            }
            player = player === "X" ? "O" : "X";
            statusDisplay.innerText = `Player ${player}'s turn`;
        }
        
        function reset() {
            board = ["", "", "", "", "", "", "", "", ""];
            player = "X"; active = true;
            statusDisplay.innerText = `Player X's turn`;
            cells.forEach(c => {
                c.innerText = "";
                c.className = "cell w-24 h-24 sm:w-32 sm:h-32 bg-slate-800/80 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-bold cursor-pointer shadow-inner";
                c.style.background = '';
            });
        }
    </script>
</body>
</html>
